include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - unit
  - integration
  - security
  - build
  - release

lint:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  image: python:3.12-slim
  script:
    - pip install -e .[dev]
    - ruff check .
    - mypy certinext

typecheck:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  image: python:3.12-slim
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libatomic1
    - pip install -e .[dev]
    - pyright

unit-test:
  stage: unit
  needs: [lint, typecheck]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - pip install -e .[dev]
    - pytest tests/ -v -m "not integration" --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

integration-test:
  stage: integration
  needs: [lint, typecheck, unit-test]
  rules:
    - if: '$CERTINEXT_SANDBOX_CLIENT_ID && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CERTINEXT_SANDBOX_CLIENT_ID && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image: python:3.12-slim
  script:
    - pip install -e .[dev]
    - pytest -m integration tests/test_integration.py -v --junitxml=integration-report.xml
  artifacts:
    when: always
    reports:
      junit: integration-report.xml
    expire_in: 1 week

sast:
  stage: security
  needs: [lint, typecheck]
  variables:
    GIT_DEPTH: 0

semgrep-sast:
  stage: security
  needs: [lint, typecheck]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

secret_detection:
  stage: security
  needs: [lint, typecheck]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_DEPTH: 0

build-test:
  stage: build
  needs: [lint, typecheck, unit-test, semgrep-sast, secret_detection]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  image: python:3.12-slim
  script:
    - pip install build twine
    - python -m build

publish-main:
  stage: release
  needs:
    - lint
    - typecheck
    - unit-test
    - semgrep-sast
    - secret_detection
    - {job: integration-test, optional: true}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: python:3.12-slim
  script:
    - pip install build twine
    - BASE_VERSION=$(python -c "import re; print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
    - DEV_VERSION="${BASE_VERSION}.dev${CI_PIPELINE_ID}"
    - sed -i "s/^version = \"${BASE_VERSION}\"/version = \"${DEV_VERSION}\"/" pyproject.toml
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

integration-cert-issuance:
  stage: integration
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CERTINEXT_SANDBOX_CLIENT_ID'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+rc\d+$/ && $CERTINEXT_SANDBOX_CLIENT_ID'
  image: python:3.12-slim
  script:
    - pip install -e .[dev]
    - pytest -m integration tests/test_sandbox_integration.py -v --junitxml=cert-issuance-report.xml
  artifacts:
    when: always
    reports:
      junit: cert-issuance-report.xml
    expire_in: 1 week

release_build:
  stage: release
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  image: python:3.12-slim
  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

release_job:
  stage: release
  needs:
    - release_build
    - {job: integration-cert-issuance, optional: true}
  rules:
    - if: $CI_COMMIT_TAG
  image: alpine:latest
  script:
    - apk add --no-cache curl git jq
    - TAG_DESC=$(git tag -l --format='%(contents)' "$CI_COMMIT_TAG" | jq -Rs .)
    - |
      curl --fail --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{\"name\":\"$CI_COMMIT_TAG\",\"tag_name\":\"$CI_COMMIT_TAG\",\"description\":$TAG_DESC}" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
