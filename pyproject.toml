[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certinext"
version = "0.1.2a3"
description = "Python client library for the CertiNext certificate management API"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "University of Maine System", email = "tod.detre@maine.edu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/tod-uma/certinext"
Repository = "https://github.com/tod-uma/certinext"
"Issue Tracker" = "https://github.com/tod-uma/certinext/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "types-requests>=2.31",
    "types-tabulate>=0.9",
    "keyring",
]
keyring = [
    "keyring",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["certinext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]

[tool.pyright]
include = ["certinext", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
