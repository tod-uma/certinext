[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certinext"
version = "1.0.0a1"
description = "Python client library for the CertiNext certificate management API"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "University of Maine System", email = "tod.detre@maine.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "structlog",
    "tomli>=2.0; python_version < '3.11'",
    "pydantic-settings>=2.3",
    "tomlkit>=0.13",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
certinext = "certinext.cli:main"
certinext-setup-keyring = "certinext.cli._aliases:setup_keyring"
certinext-setup-defaults = "certinext.cli._aliases:setup_defaults"
certinext-accounts = "certinext.cli._aliases:accounts"
certinext-domains = "certinext.cli._aliases:domains"
certinext-ledger = "certinext.cli._aliases:ledger"
certinext-list-certificates = "certinext.cli._aliases:list_certificates"
certinext-pending-dcv = "certinext.cli._aliases:pending_dcv"
certinext-domain-cert-count = "certinext.cli._aliases:domain_cert_count"
certinext-issue-cert = "certinext.cli._aliases:issue_cert"
certinext-parent-dcv-status = "certinext.cli._aliases:parent_dcv_status"
certinext-healthcheck = "certinext.cli._aliases:healthcheck"

[project.urls]
Homepage = "https://github.com/tod-uma/certinext"
Repository = "https://github.com/tod-uma/certinext"
"Issue Tracker" = "https://github.com/tod-uma/certinext/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "keyring",
    "cryptography>=42.0.0",
    "dnspython>=2.0",
]
keyring = [
    "keyring",
]
csr = [
    "cryptography>=42.0.0",
]
dns = [
    "dnspython>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["certinext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call the live CertiNext sandbox API (requires keyring profile 'sandbox')",
    "probe: live assumption-register probes (R01-R24) against sandbox or prod; env via CERTINEXT_PROBE_ENV",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]

[tool.pyright]
include = ["certinext", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# keyring ships py.typed but its backend constructors (e.g. backends.fail.Keyring)
# are unannotated. Allow calling into the keyring package without per-call
# `# type: ignore[no-untyped-call]`; our own code is still fully type-checked.
untyped_calls_exclude = ["keyring"]
